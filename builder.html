<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конструктор мероприятий — Пять элементов</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="builder.css"></head><body><header><a href="./" class="logo"><img src="assets/logo.png" alt="Пять элементов"></a><span class="header-title">Конструктор мероприятий</span><span class="storage-label">Данные в этом браузере</span><button id="newEvent" class="primary">+ Создать</button></header><div class="workspace"><aside class="library"><div class="library-heading">Мероприятия <span id="eventCount"></span></div><div id="eventList"></div><div class="library-tools"><button id="importEvent">Импорт JSON ↗</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></aside><main><div class="editor-header"><div><p class="overline" id="eventDate"></p><h1 id="eventHeading"></h1></div><button id="duplicate" class="quiet-button">Дублировать</button></div><nav id="tabs"><button data-tab="info" class="active">01 <span>О событии</span></button><button data-tab="seats">02 <span>Схема мест</span></button><button data-tab="finish">03 <span>Готово</span></button></nav><section id="content"></section><div class="bottom-bar"><span id="saveState" role="status"></span><div><button id="exportEvent" class="secondary">Скачать JSON ↓</button><button id="saveEvent" class="primary">Сохранить</button></div></div></main></div><div id="toast" role="status"></div><script src="builder.js"></script></body></html>
